<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lunatespace.com</title>
<link rel="stylesheet" href="assets/css/site.css">
<style>
  .compare {
    display: flex;
    gap: 24px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .panel {
    flex: 1 1 420px;
    max-width: 560px;
  }
  .panel h2 {
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .panel h2 .tag {
    font-weight: 400;
    color: var(--muted);
  }
  .panel .player {
    margin-top: 10px;
  }
  .feature {
    margin-top: 44px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .feature p {
    margin: 0;
    color: var(--muted);
    font-size: 0.9rem;
  }
  nav.more {
    margin-top: 20px;
    font-size: 0.85rem;
  }
  nav.more a {
    color: var(--accent);
    text-decoration: none;
  }
  nav.more a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
<main>
  <h1>lunatespace.com</h1>

  <div class="compare">
    <div class="panel">
      <h2>Before Lunate <span class="tag">(crashing)</span></h2>
      <div class="player" id="player-before">
        <div class="loading">loading frames&hellip;</div>
      </div>
      <div class="controls">
        <button id="toggle-before" type="button">Pause</button>
        <span id="label-before">frame 1 / 100</span>
      </div>
    </div>

    <div class="panel">
      <h2>With Lunate <span class="tag">(successful landing)</span></h2>
      <div class="player" id="player-with">
        <div class="loading">loading frames&hellip;</div>
      </div>
      <div class="controls">
        <button id="toggle-with" type="button">Pause</button>
        <span id="label-with">frame 1 / 100</span>
      </div>
    </div>
  </div>

  <div class="feature">
    <p>How Lunate keeps a relay in view of the south pole:</p>
    <a class="btn cta" href="orbit/">See the orbit in 3D &rarr;</a>
    <nav class="more">
      <a href="lunar-lander/">Lunar lander crash &rarr;</a>
    </nav>
  </div>
</main>

<script src="assets/js/flipbook.js"></script>
<script>
  flipbook({
    playerId: "player-before",
    toggleId: "toggle-before",
    labelId: "label-before",
    prefix: "assets/img/lunar-lander/frame-",
    alt: "Lunar lander crash animation"
  });

  flipbook({
    playerId: "player-with",
    toggleId: "toggle-with",
    labelId: "label-with",
    prefix: "assets/img/lunate-landing/frame-",
    alt: "Successful lunar landing animation"
  });
</script>
</body>
</html>
