<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunar Lander Crash &mdash; lunatespace.com</title>
<link rel="stylesheet" href="../assets/css/site.css">
</head>
<body>
<main class="narrow">
  <h1>Lunar Lander Crash</h1>
  <p class="sub">100 frames, played back at 10 frames per second</p>

  <div class="player" id="player">
    <div class="loading">loading frames&hellip;</div>
  </div>

  <div class="controls">
    <button id="toggle" type="button">Pause</button>
    <span id="frameLabel">frame 1 / 100</span>
  </div>

  <a class="back" href="../">&larr; back home</a>
</main>

<script src="../assets/js/flipbook.js"></script>
<script>
  flipbook({
    playerId: "player",
    toggleId: "toggle",
    labelId: "frameLabel",
    prefix: "../assets/img/lunar-lander/frame-",
    alt: "Lunar lander crash animation"
  });
</script>
</body>
</html>
